[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trd-worker"
version = "0.2.1"
description = "TRD Compute Network — community GPU worker. Run TRD's website-builder agents on your idle GPU and earn credits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DK", email = "compute@trdn.io" }]
keywords = ["trd", "gpu", "compute", "inference", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
trd-worker = "trd_worker.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["trd_worker*"]

[project.urls]
Homepage = "https://compute.trdn.io"
Issues = "https://github.com/TRDnetwork/trd-worker/issues"
